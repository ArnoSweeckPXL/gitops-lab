apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-qa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/stefanprodan/charts
    chart: podinfo
    targetRevision: 6.15.0
    helm:
      valuesObject:
        replicaCount: 2
        image:
          tag: 6.15.0
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo-qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
